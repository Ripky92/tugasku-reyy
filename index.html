<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arsip Tugas · Reyy</title>
  <meta name="description" content="Kumpulan tugas Reyy dalam bentuk file dan foto. Bebas dilihat dan diunduh.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#daftar">Lewati ke daftar tugas</a>
  <header class="top">
    <a class="brand" href="./"><i aria-hidden="true"></i>ARSIP/TUGAS</a>
    <a class="admin-link" href="admin.html">Admin</a>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">// arsip tugas reyy</p>
      <h1>Semua tugas saya, <em>bebas</em> Anda unduh.</h1>
      <p class="lead">Pilih kategori, cari judulnya, lalu unduh filenya langsung. Tidak perlu login.</p>
      <ul class="stats" aria-label="Ringkasan">
        <li><b id="sTasks">0</b><span>tugas</span></li>
        <li><b id="sFiles">0</b><span>file</span></li>
        <li><b id="sCats">0</b><span>kategori</span></li>
      </ul>
      <div class="controls">
        <label class="search">
          <span class="sr">Cari tugas</span>
          <input id="q" type="search" placeholder="Cari judul atau deskripsi" autocomplete="off">
        </label>
        <div id="chips" class="chips" role="group" aria-label="Filter kategori"></div>
      </div>
    </section>

    <section id="daftar" class="list" aria-live="polite">
      <p id="status" class="status">Memuat tugas…</p>
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <footer class="foot"><p>© <span id="yr"></span> Reyy</p></footer>

  <dialog id="lightbox" class="lightbox" aria-label="Pratinjau foto">
    <button class="lb-close" id="lbClose" aria-label="Tutup">×</button>
    <img id="lbImg" alt="">
    <div class="lb-bar">
      <span id="lbName"></span>
      <a id="lbDl" class="btn" href="#">Unduh</a>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
